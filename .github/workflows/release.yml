name: release

# 推送 v* 标签时自动构建安装包和便携版。
# 未配置签名证书时仍会构建，但产物未签名，Windows 可能提示未知发布者。
# 建议先在仓库 Secrets 配置 WINDOWS_CERTIFICATE_BASE64 / WINDOWS_CERTIFICATE_PASSWORD。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      DEEPSEEKCLOCK_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          $installArgs = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /NOICONS /DIR="' + $dir + '"'
          $process = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw ('Inno Setup 安装失败，退出码 ' + $process.ExitCode) }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 安装失败：找不到 ISCC.exe' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ISCC_PATH=$iscc`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: 准备签名证书
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          [IO.File]::AppendAllText($env:GITHUB_ENV, "DEEPSEEKCLOCK_PFX_PATH=$pfx`n", (New-Object System.Text.UTF8Encoding($false)))
          Write-Host '签名证书已准备。'

      - name: 构建安装包
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($env:GITHUB_EVENT_NAME -ne 'push') { $version = '1.2.0' }
          if ($env:DEEPSEEKCLOCK_PFX_PATH -and (Test-Path -LiteralPath $env:DEEPSEEKCLOCK_PFX_PATH)) {
            .\tools\build-release.ps1 -Version $version -PfxPath $env:DEEPSEEKCLOCK_PFX_PATH -PfxPassword $env:DEEPSEEKCLOCK_PFX_PASSWORD
          } else {
            Write-Warning '未配置签名证书，本次构建产物未签名。'
            .\tools\build-release.ps1 -Version $version
          }

      - name: 安装包冒烟测试
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath dist -Filter 'DeepSeekClock-Setup-v*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw '找不到安装包' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\test\Test-Installer.ps1 -SetupPath $setup.FullName -TestAutoStart

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekClock-release
          path: |
            dist/DeepSeekClock-Setup-v*.exe
            dist/DeepSeekClock-Portable-v*.zip
            dist/SHA256SUMS.txt

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeepSeekClock-Setup-v*.exe
            dist/DeepSeekClock-Portable-v*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          # 没有签名证书时先标记为预发布，配置证书后再发稳定版
          prerelease: ${{ env.WINDOWS_CERTIFICATE_BASE64 == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
